<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card harness</title>
<style>body { background: #1c1c1c; margin: 0; padding: 16px; } housewad-card { max-width: 820px; margin: 0 auto; }</style>
<housewad-card></housewad-card>
<script type="module">
import { makeFakeHass } from './fakehass.js';
await import('../../dist/housewad-card.js');
const card = document.querySelector('housewad-card');
const params = new URLSearchParams(location.search);
const allow = (params.get('allow') || 'light.*,switch.*,media_player.*,vacuum.*,lock.front_door,cover.garage_door').split(',');
card.setConfig({ allow, assets_url: '/dist/', rules: { empty_minutes: 10 } });
window.hass = makeFakeHass((h) => { card.hass = h; window.hass = h; });
card.hass = window.hass;
window.card = card;
window.booted = true;
</script>
