# Build everything and publish a release: the release commit carries dist/
# and lands on main, then is tagged. The Marketplace (and HACS) install a
# dashboard card's files from dist/ at the release tag, and their repository
# check looks at main, so main always holds the last release's build.
name: Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version (e.g. 0.1.0)
        required: true
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The version the release was built and tested with; a newer one is a
      # deliberate change (ZDBSP stopped compiling once on an unpinned one).
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 6.0.11
      - name: Freedoom
        run: |
          mkdir -p third_party && cd third_party
          curl -sL -o freedoom.zip https://github.com/freedoom/freedoom/releases/download/v0.13.0/freedoom-0.13.0.zip
          unzip -q freedoom.zip
      - name: Build
        run: |
          npm ci
          npm run build
          npm test
      - name: Release commit and tag
        run: |
          v="${{ github.event.inputs.version }}"
          sed -i "s/const VERSION = '[^']*'/const VERSION = '$v'/" card/src/card.js && npm run build:card
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist card/src/card.js
          git commit -qm "Release $v"
          git tag "v$v"
          git push origin HEAD:main "v$v"
          # Notes: docs/release-notes/<version>.md when there is one.
          notes="docs/release-notes/$v.md"
          if [ -f "$notes" ]; then
            gh release create "v$v" --title "house.wad $v" --notes-file "$notes" --verify-tag
          else
            gh release create "v$v" --title "house.wad $v" --generate-notes --verify-tag
          fi
        env:
          GH_TOKEN: ${{ github.token }}
