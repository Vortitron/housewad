# HACS's own repository check: what the default list (and Home Assistant's
# Marketplace, which installs from it from 2026.11) asks a dashboard card for.
name: Validate

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
  # As the default list checks it: by name, so HACS reads the latest release
  # (house.wad's built files are only in its release tags, never on main).
  hacs-release:
    name: HACS (latest release)
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
          repository: ${{ github.repository }}
